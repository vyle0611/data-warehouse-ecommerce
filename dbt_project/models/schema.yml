version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: orders
      - name: order_items
      - name: products
      - name: customers
      - name: sales

models:
  - name: stg_orders
    description: "Bảng đơn hàng tầng Silver"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: stg_products
    description: "Bảng sản phẩm tầng Silver"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: fact_daily_sales
    description: "Bảng Fact doanh thu tầng Gold"
    columns:
      - name: sales_date
        tests:
          - unique
          - not_null

  - name: wide_order_items
    description: "Bảng phẳng phục vụ AI/ML"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_products')
              field: product_id
