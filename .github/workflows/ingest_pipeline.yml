name: Daily Data Pipeline (Ingestion & dbt Transformation)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install duckdb==1.5.6 pandas "dbt-duckdb>=1.7.0"

      - name: 1. Run Data Ingestion (Bronze Layer)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python ingest.py

      - name: 2. Run dbt Transformation (Silver & Gold Layers)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          cd dbt_project
          dbt run --profiles-dir .
